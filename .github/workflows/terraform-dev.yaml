name: dev-zen-pharma-infra

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  zen-pharma-infra:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zen-infra/envs/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan 
        
        